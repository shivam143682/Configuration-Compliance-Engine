!
! Sample Cisco IOS configuration - HQ-Router1
! This device is intended to PASS all Enterprise Router Policy rules.
!
hostname HQ-Router1
!
aaa new-model
aaa authentication login default group tacacs+ local
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
banner motd ^
Authorized access only. All activity is logged and monitored.
^
!
interface GigabitEthernet0/0
 description WAN uplink to ISP
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN - Core Switch
 ip address 10.1.1.1 255.255.255.0
 no shutdown
!
logging host 10.1.1.50
logging trap informational
service timestamps log datetime msec
!
ntp server 10.1.1.10
ntp server 10.1.1.11
!
snmp-server community R3adOnlyStr1ng RO
snmp-server host 10.1.1.60 version 2c public
snmp-server location Data Center 1
snmp-server contact netops@example.com
!
line con 0
 login local
line vty 0 4
 transport input ssh
 login local
!
end
