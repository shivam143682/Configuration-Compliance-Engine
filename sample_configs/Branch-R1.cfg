!
! Sample Cisco IOS configuration - Branch-R1
! This device is intended to FAIL several Enterprise Router Policy rules.
!
hostname Branch-R1
!
ip ssh version 2
service timestamps
!
logging host 10.1.1.1
!
interface GigabitEthernet0/0
 ip address 192.168.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 no ip address
 shutdown
!
line vty 0 4
 transport input telnet ssh
 login
!
end
